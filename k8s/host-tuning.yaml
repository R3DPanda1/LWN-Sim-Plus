# Raises the kernel UDP receive buffer on each node so the
# chirpstack-gateway-bridge UDP socket can absorb uplink bursts from
# the simulator without RcvbufErrors.  Default rmem (~208 KiB) fits
# only ~700 PUSH_DATA packets, which overflows at tiers of a few
# thousand devices with long send intervals.  16 MiB fits ~55k packets.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: host-sysctl-tuning
  namespace: lorawan
spec:
  selector:
    matchLabels:
      app: host-sysctl-tuning
  template:
    metadata:
      labels:
        app: host-sysctl-tuning
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      initContainers:
        - name: apply-sysctl
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              sysctl -w net.core.rmem_max=16777216
              sysctl -w net.core.rmem_default=16777216
              sysctl -w net.core.netdev_max_backlog=10000
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
