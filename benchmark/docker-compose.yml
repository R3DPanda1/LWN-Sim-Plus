# Self-contained benchmark stack for LWN-Sim-Plus.
#
# Brings up ChirpStack v4 (+ Postgres, Redis, Mosquitto, gateway bridge, REST
# API), the simulator, and optionally ThingsBoard and the upstream simulator
# for the comparison benchmarks. Works on WSL2 (Docker Desktop) and native
# Linux. Run from this directory:
#
#   docker compose up -d                       # core stack
#   docker compose --profile thingsboard up -d # add ThingsBoard (provisioning cs+tb)
#   docker compose --profile upstream up -d lwn-upstream   # add upstream (comparison)
#
# The simulator is limited to one CPU to keep resource numbers comparable.
# The thesis measurements pinned it to a dedicated core (cpuset) on an 8-core
# host; that pin is omitted here so the stack runs on any core count.

services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=chirpstack
      - POSTGRES_DB=chirpstack

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./configuration/mosquitto/config/:/mosquitto/config/

  chirpstack:
    image: chirpstack/chirpstack:4
    restart: unless-stopped
    command: -c /etc/chirpstack
    ports:
      - "8080:8080"
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack
    depends_on:
      - postgres
      - mosquitto
      - redis

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=eu868/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "8090:8090"
    depends_on:
      - chirpstack

  lwn-simulator:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1024M
    ports:
      - "8002:8002"
      - "8003:8003"
    volumes:
      - ./config.docker.json:/app/config.json
      - ./simdata:/app/data
    depends_on:
      - chirpstack-gateway-bridge
      - chirpstack-rest-api

  # ThingsBoard, only needed for the provisioning benchmark's cs+tb mode.
  tb-postgres:
    image: postgres:14-alpine
    profiles: ["thingsboard"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=thingsboard
      - POSTGRES_PASSWORD=thingsboard
      - POSTGRES_DB=thingsboard
    volumes:
      - tbpostgresdata:/var/lib/postgresql/data

  thingsboard:
    image: thingsboard/tb-node:latest
    profiles: ["thingsboard"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - TB_QUEUE_TYPE=in-memory
      - SPRING_DRIVER_CLASS=org.postgresql.Driver
      - SPRING_DATASOURCE_URL=jdbc:postgresql://tb-postgres:5432/thingsboard
      - SPRING_DATASOURCE_USERNAME=thingsboard
      - SPRING_DATASOURCE_PASSWORD=thingsboard
      - HTTP_BIND_PORT=9090
      - JAVA_OPTS=-Xms512M -Xmx2G
    volumes:
      - thingsboarddata:/data
      - thingsboardlogs:/var/log/thingsboard
    depends_on:
      - tb-postgres

  # Upstream LWN-Simulator, only for the fork-vs-upstream comparison benchmarks
  # (sink_overhead, otaa_correctness). Requires the upstream repo cloned next to
  # this one:  git clone https://github.com/UniCT-ARSLab/LWN-Simulator.git
  # ../../LWN-Simulator  (relative to this repo root).
  lwn-upstream:
    profiles: ["upstream"]
    build:
      context: ../../LWN-Simulator
      dockerfile: Dockerfile
    restart: "no"
    cpus: 1.0
    mem_limit: 1024M
    ports:
      - "8012:8002"
      - "8013:8003"
    volumes:
      - ./upstream-data:/app/data
    depends_on:
      - chirpstack-gateway-bridge

volumes:
  postgresqldata:
  redisdata:
  thingsboarddata:
  thingsboardlogs:
  tbpostgresdata:
